<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Souls 3 Platinum Guide & Cheat Sheet</title>
  
  <!-- BOOTSTRAP 3 CSS -->
  <link rel="stylesheet" id="bootstrap" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">
  
  <!-- ULTRA PREMIUM FEXTRALIFE DARK THEME -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- FEXTRALIFE TOP HEADER NAVBAR -->
  <div class="fex-top-header">
    <div class="fex-header-container">
      <div class="fex-nav-brand">🔥 DARK SOULS 3 - GUIA DA PLATINA & CHECKLIST</div>

      <ul class="nav nav-tabs fex-nav-tabs" role="tablist">
        <li class="active"><a href="#tabPlaythrough" data-toggle="tab">📜 Passo a Passo</a></li>
        <li><a href="#tabNPCQuests" data-toggle="tab">👥 Quests de NPCs</a></li>
        <li><a href="#tabChecklists" data-toggle="tab">🏆 Conquistas (Platina)</a></li>
        <li><a href="#tabWeapons" data-toggle="tab">⚔️ Armas e Escudos</a></li>
        <li><a href="#tabArmors" data-toggle="tab">🛡️ Armaduras</a></li>
        <li><a href="#tabMisc" data-toggle="tab">🔮 Diversos & Dicas</a></li>
        <li><a href="#tabCredits" data-toggle="tab">⚜️ Créditos</a></li>
      </ul>

      <!-- LANGUAGE SWITCHER BUTTONS (FAR RIGHT CORNER) -->
      <div class="fex-lang-switch">
        <button type="button" id="btn_lang_pt" class="fex-subtab-btn active">🇧🇷 PT-BR</button>
        <button type="button" id="btn_lang_en" class="fex-subtab-btn">🇺🇸 EN</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="tab-content">
      
      <!-- 1. PASSO A PASSO (PLAYTHROUGH) -->
      <div class="tab-pane active" id="tabPlaythrough">
        <!-- Rendered dynamically by js/tab-playthrough.js -->
      </div>

      <!-- 2. QUESTS DE NPCS -->
      <div class="tab-pane" id="tabNPCQuests">
        <!-- Rendered dynamically by js/npc-quests.js -->
      </div>

      <!-- 3. CONQUISTAS (PLATINA & COLECIONÁVEIS) -->
      <div class="tab-pane" id="tabChecklists">
        <!-- Rendered dynamically by js/tab-checklists.js & js/steam-trophies.js -->
      </div>

      <!-- 4. ARMAS E ESCUDOS -->
      <div class="tab-pane" id="tabWeapons">
        <!-- Rendered dynamically by js/tab-equipment.js -->
      </div>

      <!-- 5. ARMADURAS -->
      <div class="tab-pane" id="tabArmors">
        <!-- Rendered dynamically by js/tab-equipment.js -->
      </div>

      <!-- 6. DIVERSOS -->
      <div class="tab-pane" id="tabMisc">
        <!-- Rendered dynamically by js/tab-equipment.js -->
      </div>

      <!-- 7. CRÉDITOS E AGRADECIMENTOS -->
      <div class="tab-pane" id="tabCredits">
        <!-- Rendered dynamically by js/tab-credits.js -->
      </div>

    </div>
    <!-- /.tab-content -->
  </div>
  <!-- /.container -->

  <!-- SCROLL TO TOP BUTTON -->
  <a class="btn btn-default btn-sm fadingbutton back-to-top" style="display: none;">Voltar ao Topo &thinsp;<span class="glyphicon glyphicon-arrow-up"></span></a>

  <!-- SCRIPTS -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.2/jquery.min.js"></script>
  <script src="https://cdn.rawgit.com/andris9/jStorage/v0.4.12/jstorage.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js" integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS" crossorigin="anonymous"></script>

  <script src="js/item-mapping.js"></script>
  <script src="js/data-playthrough.js"></script>
  <script src="js/data-playthrough-en.js"></script>
  <script src="js/data-checklists.js"></script>
  <script src="js/data-checklists-en.js"></script>
  <script src="js/npc-quests.js"></script>
  <script src="js/steam-trophies.js"></script>
  <script src="js/tab-playthrough.js"></script>
  <script src="js/tab-checklists.js"></script>
  <script src="js/tab-equipment.js"></script>
  <script src="js/tab-credits.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
